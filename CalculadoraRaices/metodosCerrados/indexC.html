<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Métodos Cerrados</title>
     <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://www.geogebra.org/apps/deployggb.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
   <script defer src="scriptC.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
    if (localStorage.getItem('modoOscuro') === 'true') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen transition duration-300">

  <header class="bg-gradient-to-r from-blue-700 to-blue-500 dark:from-blue-800 dark:to-blue-700 text-white py-6 shadow-lg relative">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="text-center md:text-left mb-4 md:mb-0">
          <h1 class="text-3xl font-bold mb-2 flex items-center gap-3">
                         <svg class="w-8 h-8 text-blue-300" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
            </svg>
            Métodos Cerrados
          </h1>
          <p class="text-blue-100 text-sm">Bisección y Regla Falsa</p>
        </div>
        <div class="flex items-center space-x-4">
          <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition-all duration-300 flex items-center space-x-2">
            <span>←</span>
            <span class="hidden sm:inline">Volver</span>
          </a>
          <button onclick="toggleModoOscuro()" 
            class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition-all duration-300 flex items-center space-x-2">
            <svg id="modo-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
            </svg>
            <span class="hidden sm:inline">Modo</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex flex-col xl:flex-row items-start justify-between max-w-7xl mx-auto px-6 py-10 gap-8">
    
    <!-- Formulario -->
    <section class="w-full xl:w-1/2 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
      <h1 class="text-2xl font-semibold mb-6">Calculadora de Bisección y Falsa Posición</h1>

      <form id="formulario" class="space-y-4">
                 <div>
           <label class="block font-semibold">Función</label>
           <div class="relative">
             <input type="text" id="funcion" placeholder="Ej: Math.pow(x,3) - x - 2" required
               class="w-full px-4 py-2 pr-20 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
             <div id="loading-indicator" class="absolute right-12 top-1/2 transform -translate-y-1/2 hidden">
               <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
             </div>
             <button type="button" id="clear-function" 
               class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 px-2 py-1 rounded transition-colors">
               <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                 <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
               </svg>
             </button>
           </div>
         </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold">xi</label>
            <input type="number" id="xi" step="any" required
              class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
          </div>
          <div>
            <label class="block font-semibold">xd</label>
            <input type="number" id="xd" step="any" required
              class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold">Tolerancia</label>
            <input type="number" id="tolerancia" step="any" required
              class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
          </div>
          <div>
            <label class="block font-semibold">Iteraciones</label>
            <input type="number" id="iteraciones" required
              class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
          </div>
        </div>
        <div>
          <label class="block font-semibold">Método</label>
          <select id="metodo"
            class="w-full px-4 py-2 rounded border border-gray-300 dark:border-gray-700 dark:bg-gray-700">
            <option value="biseccion">Bisección</option>
            <option value="falsa">Regla falsa</option>
          </select>
        </div>
                 <button type="submit"
           class="bg-blue-500 hover:bg-blue-600 active:scale-95 transition-transform text-white px-6 py-2 rounded shadow">
          Calcular
        </button>
      </form>

             <div class="flex justify-between items-center mt-8">
         <h2 class="text-xl font-bold flex items-center gap-2">
           <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
             <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
           </svg>
           Resultados
         </h2>
         <button type="button" id="capture-results" 
           class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors flex items-center space-x-2">
                       <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
            </svg>
           <span>Capturar</span>
         </button>
       </div>
               <div id="salida" class="bg-gray-100 dark:bg-gray-700 p-4 mt-2 rounded shadow-inner text-sm overflow-auto font-mono"></div>
    </section>

    <!-- GeoGebra -->
    <!-- <section class="w-full xl:w-1/2">
      <h2 class="text-xl font-bold mb-2">📈 Gráfico</h2>
      <iframe id="geogebra" width="100%" height="600" class="rounded-lg border dark:border-gray-700 shadow-lg" allowfullscreen frameborder="0"></iframe>
    </section> -->
    <section class="w-full xl:w-1/2">
             <h2 class="text-xl font-bold mb-2 flex items-center gap-2">
         <svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
        </svg>
        Gráfico
      </h2>
      <div id="geogebra-container" class="w-full h-[600px] rounded-lg border dark:border-gray-700 shadow-lg bg-white"></div>
    </section>
  </main>



  <script>
    function toggleModoOscuro() {
      const html = document.documentElement;
      const modoIcon = document.getElementById('modo-icon');
      html.classList.toggle('dark');
      localStorage.setItem('modoOscuro', html.classList.contains('dark'));
      
      // Cambiar icono
      if (html.classList.contains('dark')) {
        modoIcon.innerHTML = '<path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>';
      } else {
        modoIcon.innerHTML = '<path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>';
      }
    }

    // Inicializar icono al cargar
    window.addEventListener('load', function() {
      const modoIcon = document.getElementById('modo-icon');
      if (localStorage.getItem('modoOscuro') === 'true') {
        modoIcon.innerHTML = '<path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>';
      } else {
        modoIcon.innerHTML = '<path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>';
      }
    });

    window.addEventListener('pageshow', function (event) {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
        if (localStorage.getItem('modoOscuro') === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    });
  </script>

</body>
</html>
